name: CI / Build & Validation

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual trigger by maintainers from GitHub Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-metadata:
    name: Lint & Manifest Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate metadata.json
        run: |
          jq empty metadata.json
          NAME=$(jq -r '.name' metadata.json)
          VIEW=$(jq -r '.view' metadata.json)
          if [ "$NAME" != "ecloak" ]; then
            echo "Error: module name in metadata.json must be 'ecloak'"
            exit 1
          fi
          if [ ! -f "$VIEW" ]; then
            echo "Error: view entry '$VIEW' defined in metadata.json does not exist"
            exit 1
          fi
          echo "✔ metadata.json is valid (module: $NAME, entry: $VIEW)"

      - name: Verify License File
        run: |
          test -f LICENSE
          grep -q "Business Source License 1.1" LICENSE
          echo "✔ BSL 1.1 LICENSE file is present and verified."

      - name: Check QML File Presence
        run: |
          test -f qml/Main.qml
          test -f qml/modals/IdentityModal.qml
          test -f qml/modals/CreateRoomModal.qml
          test -f qml/modals/JoinRoomModal.qml
          test -f qml/modals/StrikeModal.qml
          echo "✔ All core QML view and modal files verified."

      - name: Validate Icon Dimensions (256x256 standard)
        run: |
          ICON=$(jq -r '.icon' metadata.json)
          if [ "$ICON" != "null" ] && [ -n "$ICON" ]; then
            if [ ! -f "$ICON" ]; then
              echo "Error: icon file '$ICON' does not exist"
              exit 1
            fi
            python3 -c "import struct; f = open('$ICON', 'rb'); f.seek(16); w, h = struct.unpack('>II', f.read(8)); assert (w, h) == (256, 256), f'Icon must be 256x256, got {w}x{h}'"
            echo "✔ Icon '$ICON' verified: exactly 256x256 PNG"
          fi

  build-nix:
    name: Nix Flake & Package (.lgx)
    runs-on: ubuntu-latest
    needs: [lint-and-metadata]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Verify Flake Check
        run: nix flake check

      - name: Build QML Module
        run: nix build .#

      - name: Build Basecamp Bundle (.lgx)
        run: nix build .#lgx

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecloak-module-artifact
          path: result/
          retention-days: 14

      - name: Release Package (.lgx) on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: result/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
